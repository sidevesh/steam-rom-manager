name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    # Forks without a deployment token should still build and upload CI artifacts.
    env:
      PUBLISH_MODE: ${{ secrets.DEPLOY_TOKEN != '' && 'onTagOrDraft' || 'never' }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4.1.6

      - name: Setup Python environment
        uses: actions/setup-python@v5.1.0
        with:
          python-version: "3.10"

      - name: Setup Node.js environment
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 24
          check-latest: true

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version-file: native/store-launcher/go.mod
          cache-dependency-path: native/store-launcher/go.sum

      - name: Install dependencies
        run: |
          npm install -g yarn@1.22
          yarn install --frozen-lockfile

      - name: Build Distribution
        run: |
          git lfs pull
          yarn run presets:validate
          yarn run build:dist
        env:
          SENTRY_AUTH: ${{ secrets.SENTRY_AUTH }}
      - name: Build Windows x64
        run: |
          node native/store-launcher/build.js x64
          yarn electron-builder --win --x64 --publish=${{ env.PUBLISH_MODE }}
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      - name: Upload Artifacts Windows
        uses: actions/upload-artifact@v4.3.3
        with:
          name: srm-build-windows
          path: |
            release/*.exe
            release/*.msi
